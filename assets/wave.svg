  </defs>
  <line x1="0" y1="20" x2="1200" y2="20" stroke="url(#divGrad)" stroke-width="1.5"/>
  <path class="line" d="M0,20 L1200,20" fill="none" stroke="url(#divGrad)" stroke-width="1.5"
