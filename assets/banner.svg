<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#0E1428"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="60%" stop-color="#C9D3FF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="20%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="80%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <style>
      .role { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; }
      @keyframes drift { 0% { transform: translate(0,0); } 50% { transform: translate(24px,-14px); } 100% { transform: translate(0,0); } }
      @keyframes pulse { 0%,100% { opacity:.55; r:2.4; } 50% { opacity:1; r:4.2; } }
      @keyframes fadeUp { 0% { opacity:0; transform: translateY(10px); } 100% { opacity:1; transform: translateY(0); } }
      .orb1 { animation: drift 9s ease-in-out infinite; }
      .orb2 { animation: drift 12s ease-in-out infinite reverse; }
      .dot { animation: pulse 2.6s ease-in-out infinite; }
      .rise1 { animation: fadeUp .9s ease-out both; }
      .rise2 { animation: fadeUp .9s ease-out .15s both; }
      .rise3 { animation: fadeUp .9s ease-out .3s both; }
    </style>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>

  <circle class="orb1" cx="180" cy="80" r="160" fill="url(#glow)" filter="url(#soft)"/>
  <circle class="orb2" cx="1040" cy="300" r="200" fill="url(#glow)" filter="url(#soft)"/>

  <!-- signature waveform motif: an LLM "signal" line -->
  <g transform="translate(340,232)" opacity="0.9">
    <path d="M0,20 L20,20 L30,4 L40,36 L50,-4 L60,44 L70,0 L80,20 L100,20"
          fill="none" stroke="url(#waveGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M120,20 L140,20 L150,10 L160,30 L170,4 L180,36 L190,20 L210,20"
          fill="none" stroke="url(#waveGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M230,20 L250,20 L260,-2 L270,42 L280,8 L290,20 L310,20"
          fill="none" stroke="url(#waveGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle class="dot" cx="30" cy="4" r="3" fill="#7C3AED"/>
    <circle class="dot" cx="170" cy="4" r="3" fill="#06B6D4"/>
    <circle class="dot" cx="260" cy="-2" r="3" fill="#3B82F6"/>
  </g>

  <text x="600" y="150" text-anchor="middle" class="role rise1"
        font-size="54" font-weight="700" fill="url(#nameGrad)" letter-spacing="0.5">
    Divya Venkatachalam T
  </text>

  <text x="600" y="190" text-anchor="middle" class="role rise2"
        font-size="19" font-weight="500" fill="#9FB3D9" letter-spacing="1.5">
    GENAI ENGINEER  ·  FOUNDER @ CLYRA  ·  FULL-STACK BUILDER
  </text>

  <g class="rise3" transform="translate(600,282)">
    <rect x="-165" y="-16" width="330" height="32" rx="16" fill="#111A33" stroke="#233150"/>
    <circle cx="-141" cy="0" r="4" fill="#22C55E"/>
    <text x="-125" y="5" font-size="13" fill="#CBD5F5" font-family="-apple-system,Segoe UI,sans-serif" letter-spacing="0.3">
      final-year CSE · Data Science @ IIT Madras
    </text>
  </g>
</svg>
