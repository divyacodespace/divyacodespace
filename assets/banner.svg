<svg class="workspace-svg" viewBox="0 0 760 500" xmlns="http://www.w3.org/2000/svg">
<style>
  .workspace-svg{ width:100%; height:100%; background:#050816; }

  .float-slow{ animation:floatSlow 6s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  .float-med{ animation:floatSlow 4.5s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  .float-fast{ animation:floatSlow 3.4s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes floatSlow{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-9px); }
  }

  .glow-pulse{ animation:glowPulse 3s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes glowPulse{
    0%,100%{ opacity:0.55; }
    50%{ opacity:1; }
  }

  .spin-slow{ animation:spin 22s linear infinite; transform-box:fill-box; transform-origin:center; }
  .spin-rev{ animation:spinRev 26s linear infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @keyframes spinRev{ to{ transform:rotate(-360deg); } }

  .breathe{ animation:breathe 4.5s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes breathe{
    0%,100%{ transform:scale(1); opacity:0.85; }
    50%{ transform:scale(1.05); opacity:1; }
  }

  .cursor-blink{ animation:blink 1s step-end infinite; }
  @keyframes blink{ 50%{ opacity:0; } }

  .node-pulse circle{ animation:nodePulse 2.6s ease-in-out infinite; }
  @keyframes nodePulse{
    0%,100%{ r:3.2; opacity:0.7; }
    50%{ r:4.4; opacity:1; }
  }

  .card-hover{ transition:transform .3s ease; }

  .wire-flow{ stroke-dasharray:5 7; animation:dashFlow 3.5s linear infinite; }
  @keyframes dashFlow{ to{ stroke-dashoffset:-140; } }

  .svg-particle{ animation:svgFloat 5s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes svgFloat{
    0%,100%{ transform:translateY(0); opacity:0.4; }
    50%{ transform:translateY(-14px); opacity:1; }
  }

  /* code syntax colors (resolved from CSS custom properties) */
  .kw{ fill:#C084FC; }
  .str{ fill:#34D399; }
  .fn{ fill:#60A5FA; }
  .var{ fill:#F3F1FF; }
  .com{ fill:#6B6C8E; }
</style>
  <rect x="0" y="0" width="760" height="500" fill="#050816"/>
      <defs>
        <linearGradient id="screenGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#12162e"/>
          <stop offset="1" stop-color="#0a0e22"/>
        </linearGradient>
        <linearGradient id="laptopBody" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#1a1f3d"/>
          <stop offset="1" stop-color="#0d1026"/>
        </linearGradient>
        <linearGradient id="baseTop" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#232a4d"/>
          <stop offset="1" stop-color="#161a34"/>
        </linearGradient>
        <radialGradient id="brainGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#A855F7" stop-opacity="0.9"/>
          <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="shieldGlow" cx="50%" cy="40%" r="60%">
          <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8"/>
          <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="rgba(124,58,237,0.16)"/>
          <stop offset="1" stop-color="rgba(6,182,212,0.10)"/>
        </linearGradient>
        <filter id="softBlur"><feGaussianBlur stdDeviation="6"/></filter>
        <filter id="glowFilter" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="4" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <!-- ===================== floor glow ===================== -->
      <ellipse cx="380" cy="430" rx="300" ry="46" fill="#7C3AED" opacity="0.12" filter="url(#softBlur)"/>

      <!-- ===================== AI brain hologram (back) ===================== -->
      <g transform="translate(560,120)">
        <circle r="46" fill="url(#brainGlow)" class="breathe"/>
        <g class="spin-slow" stroke="#C084FC" stroke-width="1.2" fill="none" opacity="0.8">
          <ellipse rx="40" ry="16"/>
          <ellipse rx="40" ry="16" transform="rotate(60)"/>
          <ellipse rx="40" ry="16" transform="rotate(120)"/>
        </g>
        <g class="spin-rev">
          <circle cx="0" cy="0" r="4" fill="#E9D5FF"/>
          <circle cx="34" cy="10" r="2.6" fill="#C084FC"/>
          <circle cx="-30" cy="-14" r="2.6" fill="#C084FC"/>
          <circle cx="-20" cy="26" r="2.2" fill="#A855F7"/>
        </g>
      </g>

      <!-- ===================== network / API nodes ===================== -->
      <g transform="translate(640,250)" class="float-med">
        <g stroke="#3B82F6" stroke-width="1" opacity="0.55">
          <line x1="0" y1="0" x2="46" y2="-28"/>
          <line x1="0" y1="0" x2="50" y2="18"/>
          <line x1="0" y1="0" x2="8" y2="46"/>
          <line x1="46" y1="-28" x2="50" y2="18"/>
        </g>
        <g class="node-pulse" fill="#60A5FA">
          <circle cx="0" cy="0" r="3.6"/>
          <circle cx="46" cy="-28" r="3.2"/>
          <circle cx="50" cy="18" r="3.4"/>
          <circle cx="8" cy="46" r="3"/>
        </g>
      </g>

      <!-- ===================== cloud icon ===================== -->
      <g transform="translate(120,70)" class="float-slow">
        <g filter="url(#glowFilter)">
          <path d="M-30,10 a16,16 0 0 1 4,-31 a22,22 0 0 1 42,-4 a17,17 0 0 1 -2,34 h-40 a12,12 0 0 1 -4,-23 z"
                fill="rgba(59,130,246,0.14)" stroke="#3B82F6" stroke-width="1.4"/>
        </g>
      </g>

      <!-- ===================== database icon ===================== -->
      <g transform="translate(200,380)" class="float-med">
        <g fill="none" stroke="#06B6D4" stroke-width="1.4" opacity="0.85">
          <ellipse cx="0" cy="-14" rx="22" ry="8" fill="rgba(6,182,212,0.10)"/>
          <path d="M-22,-14 v20 a22,8 0 0 0 44,0 v-20"/>
          <path d="M-22,-2 a22,8 0 0 0 44,0" opacity="0.6"/>
        </g>
      </g>

      <!-- ===================== git branch visualization ===================== -->
      <g transform="translate(60,240)" class="float-slow">
        <g stroke="#A855F7" stroke-width="1.6" fill="none" opacity="0.8">
          <path d="M0,0 v60"/>
          <path d="M0,20 C10,20 14,34 26,34"/>
          <path d="M26,34 v26"/>
        </g>
        <g fill="#C084FC">
          <circle cx="0" cy="0" r="3.4"/>
          <circle cx="0" cy="20" r="3.4"/>
          <circle cx="0" cy="60" r="3.4"/>
          <circle cx="26" cy="34" r="3.4"/>
          <circle cx="26" cy="60" r="3.4"/>
        </g>
      </g>

      <!-- ===================== cyber shield ===================== -->
      <g transform="translate(660,400)" class="float-fast">
        <circle r="30" fill="url(#shieldGlow)"/>
        <path d="M0,-20 L17,-12 V6 C17,18 9,26 0,30 C-9,26 -17,18 -17,6 V-12 Z"
              fill="rgba(6,182,212,0.14)" stroke="#06B6D4" stroke-width="1.6" class="glow-pulse"/>
        <path d="M-7,2 l5,6 l10,-13" fill="none" stroke="#67E8F9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- ===================== small graph card ===================== -->
      <g transform="translate(560,340)" class="float-med card-hover">
        <rect x="-46" y="-30" width="92" height="60" rx="10" fill="url(#cardGrad)" stroke="#7C3AED" stroke-opacity="0.35" stroke-width="1"/>
        <polyline points="-34,10 -18,-4 -4,4 12,-14 30,-8" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="30" cy="-8" r="2.4" fill="#34D399"/>
      </g>

      <!-- ===================== floating window: API flow ===================== -->
      <g transform="translate(30,120)" class="float-fast card-hover">
        <rect x="-8" y="-24" width="86" height="48" rx="9" fill="url(#cardGrad)" stroke="#3B82F6" stroke-opacity="0.4" stroke-width="1"/>
        <text x="8" y="-8" font-size="8" fill="#93C5FD" font-family="monospace">GET /api/v1</text>
        <text x="8" y="4" font-size="8" fill="#6EE7B7" font-family="monospace">200 OK ✓</text>
        <text x="8" y="16" font-size="7" fill="#6B6C8E" font-family="monospace">42ms</text>
      </g>

      <!-- ===================== digital circuits accent ===================== -->
      <g transform="translate(700,60)" opacity="0.8">
        <g stroke="#8B5CF6" stroke-width="1.2" fill="none" class="wire-flow">
          <path d="M0,0 h-30 v20 h-16"/>
        </g>
        <circle cx="0" cy="0" r="2.6" fill="#C084FC"/>
        <circle cx="-46" cy="20" r="2.6" fill="#C084FC"/>
      </g>

      <!-- ===================== ISOMETRIC LAPTOP ===================== -->
      <g transform="translate(300,190)">

        <!-- base / keyboard deck (isometric parallelogram) -->
        <g transform="translate(0,196)">
          <polygon points="-190,10 190,10 250,58 -250,58" fill="url(#baseTop)" stroke="#2E2A55" stroke-width="1"/>
          <polygon points="-250,58 250,58 250,70 -250,70" fill="#0c0e20"/>
          <!-- keyboard hint lines -->
          <g stroke="#3A3568" stroke-width="1" opacity="0.6">
            <line x1="-150" y1="24" x2="150" y2="24"/>
            <line x1="-165" y1="34" x2="165" y2="34"/>
            <line x1="-180" y1="44" x2="180" y2="44"/>
          </g>
          <!-- trackpad glow -->
          <ellipse cx="0" cy="34" rx="46" ry="10" fill="#7C3AED" opacity="0.10"/>
        </g>

        <!-- screen back panel (tilted) -->
        <polygon points="-190,10 190,10 165,-210 -165,-210" fill="url(#laptopBody)" stroke="#2E2A55" stroke-width="1.4"/>

        <!-- screen bezel + display -->
        <polygon points="-172,-4 172,-4 152,-192 -152,-192" fill="#000" opacity="0.4"/>
        <polygon points="-166,-10 166,-10 148,-186 -148,-186" fill="url(#screenGrad)" stroke="#7C3AED" stroke-opacity="0.5" stroke-width="1"/>

        <!-- screen glow -->
        <polygon points="-166,-10 166,-10 148,-186 -148,-186" fill="#7C3AED" opacity="0.06" class="glow-pulse"/>

        <!-- ============= CODE EDITOR CONTENT ============= -->
        <g transform="translate(-142,-176) scale(0.985)" clip-path="url(#screenClip)">
          <!-- editor top bar -->
          <rect x="0" y="0" width="286" height="16" fill="#161a34"/>
          <circle cx="10" cy="8" r="3" fill="#F87171"/>
          <circle cx="22" cy="8" r="3" fill="#FBBF24"/>
          <circle cx="34" cy="8" r="3" fill="#34D399"/>
          <text x="130" y="11" font-size="7.5" fill="#6B6C8E" font-family="monospace">agent.py</text>

          <!-- code lines -->
          <g font-family="Consolas, monospace" font-size="9.4">
            <text x="8" y="34"><tspan fill="#C084FC">def</tspan><tspan fill="#60A5FA"> build_ai</tspan><tspan fill="#F3F1FF">():</tspan></text>
            <text x="8" y="50"><tspan fill="#F3F1FF">    agent = </tspan><tspan fill="#60A5FA">CrewAI</tspan><tspan fill="#F3F1FF">()</tspan></text>
            <text x="8" y="66"><tspan fill="#F3F1FF">    model = </tspan><tspan fill="#34D399">"Llama-3"</tspan></text>
            <text x="8" y="82"><tspan fill="#C084FC">    return</tspan><tspan fill="#F3F1FF"> agent.</tspan><tspan fill="#60A5FA">run</tspan><tspan fill="#F3F1FF">()</tspan></text>
            <text x="8" y="98"><tspan fill="#6B6C8E"># vector memory online</tspan></text>
          </g>

          <!-- terminal panel -->
          <rect x="0" y="112" width="286" height="62" fill="#0a0e1f" stroke="#1f2344" stroke-width="1"/>
          <g font-family="Consolas, monospace" font-size="8.6">
            <text x="8" y="128"><tspan fill="#34D399">$</tspan><tspan fill="#E5E7EB"> python agent.py</tspan></text>
            <text x="8" y="141"><tspan fill="#34D399">✓</tspan><tspan fill="#9CA3AF"> AI initialized</tspan></text>
            <text x="8" y="154"><tspan fill="#34D399">✓</tspan><tspan fill="#9CA3AF"> Memory Loaded</tspan></text>
            <text x="8" y="167"><tspan fill="#34D399">✓</tspan><tspan fill="#9CA3AF"> Vector DB Connected</tspan></text>
            <text x="8" y="180"><tspan fill="#67E8F9">✓ Running</tspan><tspan class="cursor-blink" fill="#67E8F9">▌</tspan></text>
          </g>
        </g>
        <clipPath id="screenClip"><rect x="-142" y="-176" width="286" height="176"/></clipPath>

        <!-- laptop hinge highlight -->
        <line x1="-190" y1="10" x2="190" y2="10" stroke="#4C3FA0" stroke-width="1.4" opacity="0.6"/>
      </g>

      <!-- ===================== floating card: neural network mini ===================== -->
      <g transform="translate(112,320)" class="float-med card-hover">
        <rect x="-40" y="-28" width="80" height="56" rx="10" fill="url(#cardGrad)" stroke="#A855F7" stroke-opacity="0.35" stroke-width="1"/>
        <g stroke="#C084FC" stroke-width="0.8" opacity="0.7">
          <line x1="-22" y1="-12" x2="0" y2="-16"/>
          <line x1="-22" y1="-12" x2="0" y2="0"/>
          <line x1="-22" y1="4" x2="0" y2="-16"/>
          <line x1="-22" y1="4" x2="0" y2="0"/>
          <line x1="-22" y1="4" x2="0" y2="16"/>
          <line x1="-22" y1="-12" x2="0" y2="16"/>
          <line x1="0" y1="-16" x2="22" y2="0"/>
          <line x1="0" y1="0" x2="22" y2="0"/>
          <line x1="0" y1="16" x2="22" y2="0"/>
        </g>
        <g fill="#E9D5FF">
          <circle cx="-22" cy="-12" r="2.6"/><circle cx="-22" cy="4" r="2.6"/>
          <circle cx="0" cy="-16" r="2.6"/><circle cx="0" cy="0" r="2.6"/><circle cx="0" cy="16" r="2.6"/>
          <circle cx="22" cy="0" r="3" fill="#67E8F9"/>
        </g>
      </g>

      <!-- ===================== extra svg particles ===================== -->
      <g fill="#A78BFA">
        <circle class="svg-particle" cx="480" cy="60" r="2" style="animation-delay:-0.5s"/>
        <circle class="svg-particle" cx="700" cy="180" r="1.6" style="animation-delay:-1.5s"/>
        <circle class="svg-particle" cx="90" cy="180" r="1.8" style="animation-delay:-2.2s"/>
        <circle class="svg-particle" cx="420" cy="420" r="2.2" style="animation-delay:-3s"/>
        <circle class="svg-particle" cx="620" cy="440" r="1.6" style="animation-delay:-1s"/>
      </g>

    </svg>
